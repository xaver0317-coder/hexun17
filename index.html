        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

    const resourceMap = {};
    for (const entry of extResources) {

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: translateY(0); } }\n    ::selection { background: #ff5a2c; color: #fff; }\n    @media (max-width: 860px) {\n      .rwd-nav { padding: 16px 20px !important; }\n      .rwd-nav-links { display: none !important; }\n      .rwd-section { padding-left: 20px !important; padding-right: 20px !important; }\n      .rwd-hero { padding-top: 96px !important; }\n      .rwd-hero-grid { grid-template-columns: 1fr !important; gap: 28px !important; }\n      .rwd-hero-img { height: 300px !important; }\n      .rwd-float-card { position: static !important; margin-top: 16px !important; width: auto !important; height: auto !important; max-width: none !important; }\n      .rwd-giant { font-size: 22vw !important; }\n      .rwd-stats { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }\n      .rwd-features { grid-template-columns: 1fr !important; }\n      .rwd-route-track { overflow-x: auto !important; justify-content: flex-start !important; gap: 28px !important; -webkit-overflow-scrolling: touch; padding-bottom: 8px !important; }\n      .rwd-route-track > button { flex: 0 0 auto !important; }\n      .rwd-day-detail { grid-template-columns: 1fr !important; gap: 24px !important; }\n      .rwd-attention { grid-template-columns: 1fr !important; }\n      .rwd-info { grid-template-columns: 1fr !important; }\n      .rwd-heading { font-size: 26px !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"width:100%;\">\n\n  <div class=\"rwd-nav\" style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background-color: #F8F4F44D\">\n    <a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; font-family: 'Outfit',sans-serif; font-weight: 700; font-size: 18px; color: #2d2b2b\">\n      <span style=\"width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb44c,#ff3d1a);display:inline-block;\"><\u002Fspan>\n      九州行 · KYUSHU\n    <\u002Fa>\n    <div class=\"rwd-nav-links\" style=\"display: flex; gap: 32px; font-size: 14px; color: #2d2b2b\">\n      <a href=\"#route\" style=\"color: #2d2b2b\">路線<\u002Fa>\n      <a href=\"#itinerary\" style=\"color: #2d2b2b\">每日行程<\u002Fa>\n      <a href=\"#attention\" style=\"color: #2d2b2b\">注意事項<\u002Fa>\n      <a href=\"#info\" style=\"color: #2d2b2b\">實用資訊<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"https://maps.app.goo.gl/jK4c44Du8q3sy2TM6\" target=\"_blank\" rel=\"noopener\" style=\"color: #f3f2f2; padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 600; background-color: #2d2b2b\">查看地圖<\u002Fa>\n  <\u002Fdiv>\n\n  <section id=\"top\" class=\"rwd-hero rwd-section\" style=\"position: relative; padding: 132px 40px 0; background: linear-gradient(180deg, #E4DFDF, #FF3700); overflow: hidden\">\n    <div class=\"rwd-hero-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;animation:fadeUp .6s ease both;\">\n      <div>\n        <div style=\"display:inline-flex;align-items:center;gap:8px;background:#1f1f1e;color:#e8b98a;border-radius:999px;padding:8px 16px;font-size:13px;margin-bottom:24px;\">2026.09.12 — 09.19 · 9州8天7夜<\u002Fdiv>\n        <h1 style=\"font-family:'Outfit',sans-serif;font-size:clamp(38px,5.5vw,64px);line-height:1.05;font-weight:700;color:#f5f5f3;margin:0 0 20px;\">\n          <div style=\"color: var(--color-neutral-900);white-space:nowrap;\">熊本福岡<\u002Fdiv>\n          \n          <div style=\"color: var(--color-neutral-900);white-space:nowrap;\">日幣花光<\u002Fdiv>\n          \n        <\u002Fh1>\n        <p style=\"font-size: 17px; color: var(--color-neutral-900); max-width: 460px; margin: 0 0 32px; line-height: 1.6\">熊本城與街町、由布院的溫泉慢旅、福岡的神社與屋台美食 —— 一次走完九州精華的 8 天行程，逐日附上營業狀態確認。<\u002Fp>\n        <div style=\"display:flex;gap:14px;align-items:center;\">\n          <a href=\"#itinerary\" style=\"display:inline-flex;align-items:center;gap:10px;background:#f5f5f3;color:#141414;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px;\">\n            <span style=\"width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb44c,#ff3d1a);display:inline-block;\"><\u002Fspan>\n            開始探索\n          <\u002Fa>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;\">\n        <div style=\"border-radius:28px;overflow:hidden;position:relative;\">\n          <image-slot id=\"hero-img\" shape=\"rect\" class=\"rwd-hero-img\" placeholder=\"放入行程封面照片（如熊本城 / 金鱗湖）\" style=\"height: 460px; width: 451px\" src=\"e886ad4f-0105-430e-a2e6-7b62effb2cd5\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div class=\"rwd-float-card\" style=\"position: absolute; top: 424px; right: 16px; background: rgba(20,20,20,0.85); backdrop-filter: blur(6px); border-radius: 20px; padding: 18px 22px; max-width: 200px; box-shadow: 0 20px 40px rgba(0,0,0,0.35); width: 190px; height: 64px\">\n          <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:8px;\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#ff5a2c;display:inline-block;\"><\u002Fspan>\n            <span style=\"font-size:11px;color:#9a9a96;\">亮點行程<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"color:#f5f5f3;font-weight:700;font-size:15px;\">熊本↔福岡<\u002Fdiv>\n          <div style=\"color:#7d7d78;font-size:12px;margin-top:2px;\">一日7餐沒胖9公斤不准回台灣<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:8px;padding-bottom:8px;overflow:hidden;\">\n      <div class=\"rwd-giant\" style=\"font-family: 'Outfit',sans-serif; font-weight: 800; font-size: 11vw; line-height: 1.15; letter-spacing: -0.03em; color: #eae9e9; -webkit-text-stroke: 1px #3a3a38; white-space: nowrap;\">KYUSHU<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"rwd-section\" style=\"padding:56px 40px;background:#f4f3f0;\">\n    <div class=\"rwd-stats\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border-radius:20px;padding:24px;\">\n          <div style=\"font-family:'Outfit',sans-serif;font-size:34px;font-weight:700;color:#141414;\">{{ s.value }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8a8a86;margin-top:4px;\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"rwd-section\" style=\"padding:24px 40px 72px;background:#f4f3f0;\">\n    <div style=\"display:flex;align-items:flex-start;gap:16px;max-width:900px;\">\n      <span style=\"width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb44c,#ff3d1a);flex-shrink:0;margin-top:8px;\"><\u002Fspan>\n      <p style=\"font-family:'Outfit',sans-serif;font-size:clamp(22px,3vw,34px);font-weight:600;line-height:1.35;margin:0;\">\n        <span style=\"color: rgb(20, 20, 20);\">熊本・由布院・福岡<\u002Fspan> —— 是一場結合 <span style=\"display: inline-block; width: 22px; height: 12px; border-radius: 999px; background: linear-gradient(90deg, rgb(255, 180, 76), rgb(255, 61, 26)); vertical-align: middle;\"><\u002Fspan> <span style=\"color: rgb(20, 20, 20);\">古城漫遊<\u002Fspan>、<span style=\"color: rgb(138, 138, 134);\">破產慢旅<\u002Fspan> 與 <span style=\"color: rgb(20, 20, 20);\">屋台美食<\u002Fspan> <span style=\"color: rgb(138, 138, 134);\">的 8 天九州行程，用最順暢的節奏走完三地精華。<\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rwd-features\" style=\"display:grid;grid-template-columns:2fr 1.4fr 1.4fr 1fr;gap:20px;margin-top:48px;\">\n      <a href=\"#itinerary\" class=\"theme-card\" style=\"background:#141414;border-radius:24px;padding:28px;color:#f5f5f3;display:flex;flex-direction:column;justify-content:space-between;min-height:220px;\">\n        <span style=\"display:inline-flex;background:#2a2a28;color:#e8b98a;border-radius:999px;padding:6px 14px;font-size:12px;width:fit-content;\">熊本<\u002Fspan>\n        <div>\n          <div style=\"font-weight:700;font-size:19px;margin-bottom:6px;\">古城與市街<\u002Fdiv>\n          <div style=\"font-size:13px;color:#9a9a96;\">熊本城、下通商店街，行程開場與收尾都在此。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#itinerary\" style=\"border-radius:24px;overflow:hidden;position:relative;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;background:linear-gradient(160deg,#3a2a20,#1a1210);color:#f5f5f3;\">\n        <span style=\"display:inline-flex;background:rgba(255,255,255,0.12);border-radius:999px;padding:6px 14px;font-size:12px;width:fit-content;margin-bottom:auto;\">由布院<\u002Fspan>\n        <div style=\"font-weight:700;font-size:19px;margin-bottom:6px;\">溫泉慢遊<\u002Fdiv>\n        <div style=\"font-size:13px;color:#c9c8c4;\">金鱗湖與湯之坪街道，一日悠閒小鎮散策。<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#itinerary\" style=\"border-radius:24px;padding:24px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,#ff8a4c,#ff3d1a);color:#fff;\">\n        <span style=\"display:inline-flex;background:rgba(255,255,255,0.2);border-radius:999px;padding:6px 14px;font-size:12px;width:fit-content;margin-bottom:auto;\">福岡<\u002Fspan>\n        <div style=\"font-weight:700;font-size:19px;margin-bottom:6px;\">屋台與拉麵<\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(255,255,255,0.85);\">中洲屋台、一蘭總本店，深夜也能吃得到。<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#info\" style=\"background:#fff;border-radius:24px;padding:24px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;\">\n        <span style=\"display:inline-flex;background:#f0efec;color:#8a8a86;border-radius:999px;padding:6px 14px;font-size:12px;width:fit-content;margin-bottom:auto;\">實用<\u002Fspan>\n        <div style=\"font-weight:700;font-size:19px;margin-bottom:6px;\">交通與退稅<\u002Fdiv>\n        <div style=\"font-size:13px;color:#8a8a86;\">交通卡、網路、免稅資訊一次掌握。<\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"route\" class=\"rwd-section\" style=\"padding: 72px 40px; background: linear-gradient(180deg, #DB7C6D, #D13A22)\">\n    <div style=\"display:inline-flex;background:#2a2a28;color:#e8b98a;border-radius:999px;padding:6px 16px;font-size:12px;margin-bottom:16px;\">路線總覽<\u002Fdiv>\n    <h2 class=\"rwd-heading\" style=\"font-family:'Outfit',sans-serif;font-size:30px;font-weight:700;color:#f5f5f3;margin:0 0 40px;\">8 天路線地圖<\u002Fh2>\n    <div class=\"rwd-route-track\" style=\"position:relative;display:flex;justify-content:space-between;padding-top:16px;\">\n      <div style=\"position:absolute;top:24px;left:0;right:0;height:1px;background:#2a2a28;\"><\u002Fdiv>\n      <sc-for list=\"{{ daysView }}\" as=\"d\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ d.select }}\" aria-label=\"{{ d.routeAriaLabel }}\" aria-current=\"{{ d.ariaCurrent }}\" style=\"background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;padding:0;font-family:'Manrope',sans-serif;\">\n          <div style=\"width:14px;height:14px;border-radius:50%;background:{{ d.dotBg }};border:2px solid #ff5a2c;z-index:1;\"><\u002Fdiv>\n          <div style=\"font-size: 11px; color: #fff2ef\">Day{{ d.day }}<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:{{ d.labelWeight }};color:#e8e8e4;white-space:nowrap;\">{{ d.area }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"itinerary\" class=\"rwd-section\" style=\"padding:72px 40px;background:#f4f3f0;\">\n    <div style=\"display:inline-flex;background:#eee4da;color:#c05a1e;border-radius:999px;padding:6px 16px;font-size:12px;margin-bottom:16px;\">每日行程<\u002Fdiv>\n    <h2 class=\"rwd-heading\" style=\"font-family:'Outfit',sans-serif;font-size:30px;font-weight:700;margin:0 0 32px;\">選擇天數查看詳情<\u002Fh2>\n\n    <div role=\"tablist\" aria-label=\"每日行程頁籤\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px;\">\n      <sc-for list=\"{{ daysView }}\" as=\"d\" hint-placeholder-count=\"8\">\n        <button role=\"tab\" id=\"{{ d.tabId }}\" aria-selected=\"{{ d.ariaSelected }}\" aria-controls=\"{{ d.panelId }}\" sc-camel-tab-index=\"{{ d.tabIndex }}\" data-day=\"{{ d.day }}\" sc-camel-on-click=\"{{ d.select }}\" sc-camel-on-key-down=\"{{ d.onKeyDown }}\" style=\"{{ d.tabStyle }}\">Day {{ d.day }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div key=\"{{ activeDay }}\" id=\"{{ activeDayData.panelId }}\" role=\"tabpanel\" aria-labelledby=\"{{ activeDayData.tabId }}\" sc-camel-tab-index=\"-1\" class=\"rwd-day-detail\" style=\"display:grid;grid-template-columns:0.9fr 1.4fr;gap:40px;animation:fadeUp .35s ease both;\">\n      <div>\n        <div style=\"border-radius:24px;overflow:hidden;margin-bottom:20px;aspect-ratio:1/1;width:100%;\">\n          <image-slot id=\"{{ activeDayImgId }}\" shape=\"rect\" placeholder=\"放入 Day {{ activeDay }} 照片\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;margin:0 0 16px;line-height:1.4;\">Day {{ activeDay }} · {{ activeDayData.title }}<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:16px;padding:16px 0;\">\n          <div style=\"padding:0 20px;border-right:1px solid #e6e4e0;\">\n            <div style=\"font-size:11px;color:#8a8a86;\">日期<\u002Fdiv>\n            <div style=\"font-weight:700;font-size:15px;\">{{ activeDayData.date }}（{{ activeDayData.weekday }}）<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 20px;\">\n            <div style=\"font-size:11px;color:#8a8a86;\">景點/店家數<\u002Fdiv>\n            <div style=\"font-weight:700;font-size:15px;\">{{ activeDayData.spotCount }} 處<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <sc-for list=\"{{ activeDayData.spots }}\" as=\"spot\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;background:#fff;border-radius:18px;padding:20px 22px;margin-bottom:12px;\">\n            <div>\n              <div style=\"font-size:12px;font-weight:700;color:#c05a1e;margin-bottom:4px;\">{{ spot.time }}<\u002Fdiv>\n              <div style=\"font-weight:700;font-size:15px;margin-bottom:4px;\">{{ spot.name }}<\u002Fdiv>\n              <sc-if value=\"{{ spot.note }}\">\n                <div style=\"font-size:13px;color:#5c5c58;margin-top:4px;line-height:1.6;\">{{ spot.note }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <a href=\"https://maps.app.goo.gl/DJXgtGFA66sEZqHB8\" target=\"_blank\" rel=\"noopener\" style=\"{{ spot.tagStyle }}flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;\">📍 地圖<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"attention\" class=\"rwd-section\" style=\"padding:72px 40px;background:#141414;\">\n    <div style=\"display:flex;justify-content:center;margin-bottom:16px;\">\n      <span style=\"display:inline-flex;background:#2a2a28;color:#e8b98a;border-radius:999px;padding:6px 16px;font-size:12px;\">需注意事項<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"rwd-heading\" style=\"font-family: 'Outfit',sans-serif; font-size: 30px; font-weight: 700; color: #f5f5f3; margin: 0 0 32px; text-align: center\">行程中的注意<\u002Fh2>\n    <div class=\"rwd-attention\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px;\">\n      <sc-for list=\"{{ attentionItems }}\" as=\"item\" hint-placeholder-count=\"2\">\n        <div style=\"background:#1f1f1e;border-radius:20px;padding:24px;\">\n          <div style=\"font-size:12px;color:#e8b98a;margin-bottom:8px;\">Day {{ item.day }} · {{ item.name }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c9c8c4;line-height:1.6;\">{{ item.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family: 'Outfit',sans-serif; font-size: 22px; font-weight: 700; color: #f5f5f3; margin: 48px 0 20px; text-align: center\">熊本機場 ⇄ 市區交通方案<\u002Fh3>\n    <div class=\"rwd-attention\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px;\">\n      <div style=\"background:#1f1f1e;border-radius:20px;padding:28px;\">\n        <div style=\"font-size:12px;color:#e8b98a;margin-bottom:10px;\">方案一<\u002Fdiv>\n        <div style=\"font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:#f5f5f3;margin-bottom:16px;\">直達巴士（機場豪華巴士 / 機場特快巴士）<\u002Fdiv>\n        <div style=\"font-size:14px;color:#c9c8c4;line-height:1.75;\">\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">乘車地點：<\u002Fspan>熊本機場 1 樓出口處 4號站牌（豪華巴士）或 3號站牌（特快巴士）<\u002Fdiv>\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">優點：<\u002Fspan>一車直達市區，無須搬行李換乘，非常方便。<\u002Fdiv>\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">搭乘方式：<\u002Fspan>出航廈後至 4 號站牌搭乘「機場豪華巴士（Limousine Bus）」。於『熊本櫻町巴士總站』（熊本桜町バスターミナル）下車（若要前往通町筋或熊本車站亦可直接搭乘）。<\u002Fdiv>\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">預估車程：<\u002Fspan>約 45～50 分鐘<\u002Fdiv>\n          <div><span style=\"color:#e8b98a;\">預估車資：<\u002Fspan>約 1,000日圓（支援 IC 卡如 Suica/ICOCA 或現場刷卡/購票）<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1f1f1e;border-radius:20px;padding:28px;\">\n        <div style=\"font-size:12px;color:#e8b98a;margin-bottom:10px;\">方案二<\u002Fdiv>\n        <div style=\"font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:#f5f5f3;margin-bottom:16px;\">機場接駁車 轉乘 JR 電車（機場 Liner + JR 豐肥本線）<\u002Fdiv>\n        <div style=\"font-size:14px;color:#c9c8c4;line-height:1.75;\">\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">乘車地點：<\u002Fspan>熊本機場 1 樓出口處 6號站牌<\u002Fdiv>\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">優點：<\u002Fspan>遇到市區尖峰時段塞車時，搭乘電車時間較為準確，且整體車資較省。<\u002Fdiv>\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">搭乘方式：<\u002Fspan>於 6 號站牌搭乘「阿蘇熊本機場快線（機場 Liner）」至 JR 肥後大津站。抵達 JR 肥後大津站後，轉乘 JR 豐肥本線 電車前往熊本市區（如：新水前寺站、熊本站）。<\u002Fdiv>\n          <div style=\"margin-bottom:12px;\"><span style=\"color:#e8b98a;\">預估車程：<\u002Fspan>機場接駁車至肥後大津站：約 15 分鐘；JR 電車至熊本車站：約 35～40 分鐘<\u002Fdiv>\n          <div><span style=\"color:#e8b98a;\">預估車資：<\u002Fspan>機場接駁車：200日圓；JR 電車（肥後大津 ➔ 熊本）：480日圓，合計：約 680日圓<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 13px; color: #9a9a96; margin-top: 16px; text-align: center\">返回機場亦同下車地點<\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;margin-top:20px;\">\n      <a href=\"https://www.kumamoto-airport.co.jp/zh-TW/%E8%A8%AA%E5%95%8F/\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;background:#f5f5f3;color:#141414;padding:12px 26px;border-radius:999px;font-size:14px;font-weight:600;\">參考網址 →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"info\" class=\"rwd-section\" style=\"padding:72px 40px;background:#f4f3f0;\">\n    <div style=\"display:inline-flex;background:#eee4da;color:#c05a1e;border-radius:999px;padding:6px 16px;font-size:12px;margin-bottom:16px;\">實用資訊<\u002Fdiv>\n    <h2 class=\"rwd-heading\" style=\"font-family:'Outfit',sans-serif;font-size:30px;font-weight:700;margin:0 0 32px;\">交通・網路・退稅<\u002Fh2>\n    <div class=\"rwd-info\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n      <sc-for list=\"{{ practicalInfo }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border-radius:20px;padding:26px;\">\n          <div style=\"font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-bottom:12px;\">{{ p.title }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:#7d7d78;line-height:1.6;\">{{ p.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer class=\"rwd-section\" style=\"padding:32px 40px;background:#141414;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;\">\n    <div style=\"font-family:'Outfit',sans-serif;font-weight:700;color:#f5f5f3;\">熊本・由布院・福岡 8日行程<\u002Fdiv>\n    <div style=\"font-size:12px;color:#7d7d78;\">營業狀態依 2026/9 資料確認，出發前請再次核實。<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;day4AreaLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;熊本→福岡&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Day 4&quot;}}\">\n\nclass Component extends DCLogic {\n  state = { activeDay: 1 };\n\n  days = [\n    { day: 1, date: '9/12', weekday: '週五', area: '熊本', title: '抵達熊本 → 熊本城與市區巡禮', spots: [\n      { time: '06:00 - 09:30', name: '飛往熊本機場', status: 'ok' },\n      { time: '10:30', name: 'REF Kumamoto by VESSEL HOTELS 辦理寄放行李', status: 'ok' },\n      { time: '11:00 - 14:00', name: '參觀熊本城，順逛 SAKURA MACHI 櫻町熊本商城', status: 'ok' },\n      { time: '14:30 - 16:00', name: '熊本熊廣場 拍照與互動', status: 'ok' },\n      { time: '16:30 - 19:00', name: '（可換）逛 Shimotori Shopping Arcade（下通商店街）', status: 'ok' },\n      { time: '晚餐推薦', name: '（可換）熊本黑亭拉麵（焦蒜豚骨拉麵）', status: 'ok' },\n    ]},\n    { day: 2, date: '9/13', weekday: '週六', area: '由布院', title: '由布院一日輕旅行', spots: [\n      { time: '08:30 - 17:00', name: '搭車或參加一日遊前往由布院站周邊老街與金鱗湖散策', status: 'ok' },\n      { time: '18:30 - 20:30', name: '返回熊本，至若松屋享用傳統鰻魚飯', status: 'ok' },\n    ]},\n    { day: 3, date: '9/14', weekday: '週日', area: '熊本', title: '熊本深度探索【秘境神社 → 庭園名勝 → 在地名物】（全面修正版）', spots: [\n      { time: '09:30 - 11:30', name: '加藤神社（遠眺熊本城天守閣最佳視角）。', status: 'ok' },\n      { time: '12:00 - 14:30', name: '下通商店街 / 新市街 逛街採買。', status: 'ok' },\n      { time: '15:00 - 17:00', name: '水前寺成趣園 散步巡禮。', status: 'ok' },\n      { time: '17:30 - 19:30', name: '勝烈亭豬排（新市街本店） 享用晚餐。', status: 'ok' },\n    ]},\n    { day: 4, date: '9/15', weekday: '週一', area: '福岡', title: '移防福岡市中心 → 博多站巡禮與中洲夜生活', spots: [\n      { time: '09:30 - 11:30', name: '退房前古蹟散策', note: '走訪 真言宗 東長寺 或 住吉神社。', status: 'ok' },\n      { time: '12:00 - 14:00', name: '交通移動與 Check-in', note: '從熊本搭車前往福岡，14:00 抵達 福岡中洲川端威斯特酒店 辦理入住。', status: 'ok' },\n      { time: '14:30 - 18:30', name: '博多車站商圈巡禮', note: '專攻 JR Hakata City 周邊店家：Pokémon Center FUKUOKA（📍 必去）、Dacomecca（📍 必去，人氣明太子麵包）、YAMAYA BASE、辛子明太子島本 博多阪急店、治一郎（布丁）、Imonne Hakata（麻糬冰淇淋）。', status: 'ok' },\n      { time: '19:00 - 21:00', name: '中洲屋台與表演', note: '造訪 中洲屋台橫丁（📍 必去）體驗屋台文化，並至 一蘭拉麵 總本店（📍 必去）觀賞 20:00-20:15 的表演。', status: 'ok' },\n      { time: '21:30', name: '夜間宵夜', note: '在博多採買 冷凍炸雞 努努雞（📍 必去）回飯店享用。', status: 'ok' },\n    ]},\n    { day: 5, date: '9/16', weekday: '週二', area: '福岡', title: '博多運河城買鞋 → 傳統神社與天神商圈', spots: [\n      { time: '09:30 - 10:30', name: '神社參拜', note: '造訪 櫛田神社（📍 必去）。', status: 'ok' },\n      { time: '10:30 - 13:00', name: '博多運河城逛街', note: '造訪 博多運河城（📍 必去），專攻 Onitsuka Tiger CANAL CITY HAKATA 與買鞋區。', status: 'ok' },\n      { time: '13:00 - 14:00', name: '周邊伴手禮採購', note: '前往 The Full Full Hakata（人氣明太子麵包）並選購 HAKATA ORIOORI 西點伴手禮。', status: 'ok' },\n      { time: '14:00 - 15:30', name: '午餐饗宴', note: '享用 水炊.雞肉料理 とりまぶし。', status: 'ok' },\n      { time: '16:00 - 18:30', name: '天神商圈大採買', note: '專攻 天神地下街（📍 必去）與 Mina 天神，採購服飾與鞋款。', status: 'ok' },\n      { time: '19:00 - 21:00', name: '日式燒肉晚餐', note: '享用 肉の山翔（Niku no Yamasho）。', status: 'ok' },\n      { time: '21:00 - 22:30', name: '居酒屋續攤', note: '推薦至 鉄板焼酒場 いくら 天神今泉店（Ikura）。', status: 'ok' },\n      { time: '隨時彈性', name: '甜點提案', note: '品嚐 伊都King 天神店（草莓系列甜點）。', status: 'ok' },\n    ]},\n    { day: 6, date: '9/17', weekday: '週三', area: '福岡', title: '輕便悠閒 / 彈性調整行程（全面更新版）', spots: [\n      { time: '08:30 - 10:00', name: '特色咖啡早餐', note: '山水水出咖啡 享用咖啡與早餐（咖啡加 100 日元享早餐組合）。（早晨體力充沛彈性選項）：若早起體力許可，可先前往 太宰府天滿宮 參拜、漫步參道，享用現烤梅枝餅。', status: 'ok' },\n      { time: '10:00 - 11:30', name: '老街散散步', note: '川端通商店街 悠閒散步與逛在地小店。', status: 'ok' },\n      { time: '12:00 - 17:30', name: 'LaLaport 購物與鋼彈巡禮', note: '前往 LaLaport 福岡 購物，至 5 Chome-3-3 Naka 觀賞 1:1 實體鋼彈表演與打卡。中餐直接在 LaLaport 美食街或餐廳解決。', status: 'ok' },\n      { time: '18:00 - 19:30', name: '在地烏龍麵晚餐', note: '享用在地人氣 葉隱烏龍麵。', status: 'ok' },\n      { time: '19:30 - 21:30', name: '夜間景點彈性選項', note: '晚餐後若仍有體力，可擇一前往 BOSS E · ZO FUKUOKA 體驗體感娛樂設施，或前往 福岡塔 欣賞夜景。', status: 'ok' },\n    ]},\n    { day: 7, date: '9/18', weekday: '週四', area: '福岡→熊本', title: '12:00 返熊本 → 熊本市區最後採買', spots: [\n      { time: '09:30 - 11:30', name: '退房前最後補貨', note: '退房前至 Welcia Hakatagion（藥局） 與 MaxValu 博多祇園店（超市） 採購。', status: 'ok' },\n      { time: '12:00 - 14:00', name: '啟程返熊本與 Check-in', note: '啟程返回熊本，前往 SOTETSU GRAND FRESA KUMAMOTO 辦理入住。', status: 'ok' },\n      { time: '14:00 - 18:00', name: '熊本市區大採買', note: 'Carino 熊本 最後採買，補逛下通商店街未完區域。(貼心提醒)：若同行有高雄朋友，請特別注意預留搭機與前往機場的時間。', status: 'ok' },\n      { time: '18:30 - 20:30', name: '日式壽司晚餐', note: '晚餐推薦二選一：築地すし鮮 熊本総本店 或 天草瓢六（壽司·關東煮 天草）。', status: 'ok' },\n    ]},\n    { day: 8, date: '9/19', weekday: '週五', area: '返台', title: '返台', spots: [\n      { time: '06:30', name: '退房前往熊本機場', status: 'ok' },\n      { time: '09:00', name: '搭乘航班飛往桃園機場', status: 'ok' },\n    ]},\n  ];\n\n  stats = [\n    { value: '8', label: 'Days 天數' },\n    { value: '3', label: 'Areas 地區' },\n    { value: '30+', label: 'Spots 景點/店家' },\n    { value: '0', label: '需留意事項' },\n  ];\n\n  practicalInfo = [\n    { title: '交通', body: '熊本、由布院、福岡間可利用高速巴士（如由布院之森）銜接；福岡市區以地下鐵與巴士為主，建議準備 SUICA / ICOCA 類交通卡。' },\n    { title: '網路', body: '機場可租借 Pocket WiFi 或購買當地 eSIM；車站、便利商店與多數商店街周邊也提供免費 WiFi 熱點。' },\n    { title: '退稅', body: '多數藥妝店、百貨與商店街店家提供現場免稅（Tax-free），同店單日消費滿一定金額可退稅，需出示護照並保留退稅憑證至離境。' },\n  ];\n\n  // Roving-tabindex keyboard nav for the day tablist: works off the DOM\n  // (event target's siblings), so it needs no refs and keeps working\n  // unchanged in a bundled/standalone export.\n  handleTabKeyDown = (e) => {\n    const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];\n    if (!keys.includes(e.key)) return;\n    e.preventDefault();\n    const tabs = Array.from(e.currentTarget.parentElement.querySelectorAll('[role=\"tab\"]'));\n    const currentIndex = tabs.indexOf(e.currentTarget);\n    let nextIndex = currentIndex;\n    if (e.key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;\n    else if (e.key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;\n    else if (e.key === 'Home') nextIndex = 0;\n    else if (e.key === 'End') nextIndex = tabs.length - 1;\n    const nextTab = tabs[nextIndex];\n    nextTab.focus();\n    this.setState({ activeDay: Number(nextTab.dataset.day) });\n  };\n\n  renderVals() {\n    const day4Label = this.props.day4AreaLabel ?? '熊本→福岡';\n    const days = this.days.map(d => d.day === 4 ? { ...d, area: day4Label } : d);\n    const activeDay = this.state.activeDay;\n    const activeDayData = days.find(d => d.day === activeDay);\n    const withLabels = {\n      ...activeDayData,\n      tabId: 'day-tab-' + activeDay,\n      panelId: 'day-panel-' + activeDay,\n      spotCount: activeDayData.spots.length,\n      spots: activeDayData.spots.map(s => ({\n        ...s,\n        mapUrl: s.mapUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name)),\n        tagStyle: 'background:#eaf1fb;color:#2f5fa8;border-radius:999px;padding:6px 14px;font-size:12px;text-decoration:none;',\n      })),\n    };\n    const daysView = days.map(d => {\n      const isActive = d.day === activeDay;\n      return {\n        day: d.day,\n        area: d.area,\n        tabId: 'day-tab-' + d.day,\n        panelId: 'day-panel-' + d.day,\n        select: () => this.setState({ activeDay: d.day }),\n        onKeyDown: this.handleTabKeyDown,\n        tabIndex: isActive ? 0 : -1,\n        ariaSelected: isActive ? 'true' : 'false',\n        ariaCurrent: isActive ? 'true' : 'false',\n        routeAriaLabel: '前往 Day ' + d.day + ' · ' + d.area,\n        dotBg: isActive ? '#ff5a2c' : '#141414',\n        labelWeight: isActive ? '700' : '400',\n        tabStyle: isActive\n          ? 'background:#141414;color:#f5f5f3;border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;'\n          : 'background:#fff;color:#141414;border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;',\n      };\n    });\n    const attentionItems = [];\n    days.forEach(d => d.spots.forEach(s => { if (s.status === 'warn') attentionItems.push({ day: d.day, name: s.name, note: s.note }); }));\n    return {\n      daysView,\n      activeDay,\n      activeDayData: withLabels,\n      activeDayImgId: 'day-img-' + activeDay,\n      stats: this.stats,\n      attentionItems,\n      practicalInfo: this.practicalInfo,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
